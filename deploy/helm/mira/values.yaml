replicaCount: 1

image:
  # Pullable registry URI placeholder (matches the Fargate task definition).
  # Override per environment; not a GitHub org/repo slug.
  repository: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/mira
  tag: latest
  pullPolicy: IfNotPresent

deploymentProfile: customer-k8s

# Plain (non-secret) env config, e.g. LLM_BASE_URL / LLM_MODEL / MODEL_ROUTES.
# extraEnv:
#   - name: LLM_BASE_URL
#     value: https://api.deepseek.com/v1
#   - name: LLM_MODEL
#     value: deepseek-chat
extraEnv: []

# Name of a pre-created Kubernetes Secret whose keys become env vars —
# the place for LLM_API_KEY. Create it out-of-band, never in values:
#   kubectl create secret generic mira-llm --from-literal=LLM_API_KEY=<key>
envFromSecret: ""

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
