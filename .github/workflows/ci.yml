name: CI

on:
  push:
    branches: [main, "task/**", "feature/**", "chore/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run import isolation lint
        run: make lint-imports
      - name: Run sanitize check
        run: make sanitize-check
      - name: Run tests
        run: make test
