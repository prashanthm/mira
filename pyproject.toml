[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mira"
version = "1.0.0"
description = "Mira — Multi-agent Insight & Reasoning Architecture: a reference agentic-AI implementation"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.0",
    # Pin LangGraph 0.3.x: StateStoreCheckpointer relies on InMemorySaver private attrs (M1).
    # Loose bounds (langgraph>=0.2 + langchain-core>=0.3) make pip backtrack for hours.
    "langgraph>=0.3,<0.4",
    "langchain-core>=0.3.36,<0.4",
    # Production WSGI server. The stdlib wsgiref dev server is single-threaded and
    # mishandles streamed (SSE) responses behind a Docker Desktop port-forward —
    # /turn silently returns empty. waitress is a real threaded WSGI server.
    "waitress>=3.0",
]

[project.scripts]
# One-step chatbot CLI. Needs the [llm,mcp] extras at runtime.
mira-chat = "mira.chat:cli"
# Domain-agent scaffold generator (ADR-016).
mira-scaffold = "mira.scaffold:main"
# Advisory insight report over the Vantage MCP server (Phase V3). Needs [mcp].
mira-insights = "mira.insights_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# OpenAI-compatible LLM provider (ADR-010): point LLM_BASE_URL at any /v1 endpoint
# (Ollama/vLLM direct; AWS Bedrock via a LiteLLM proxy). Uses the plain ``openai`` SDK —
# NOT langchain — so the framework stays contained to orchestration/ (ADR-007). Optional
# so the core import path and the network-free echo-stub test path stay SDK-free (ADR-002).
llm = ["openai>=1.40"]
# Remote MCP tool ingestion (Task 2): declared MCP server registry consumed by
# langchain-mcp-adapters' MultiServerMCPClient over Streamable HTTP.
# 0.2+ imports langchain_core.messages.content (langchain-core 1.x only).
# Pin mcp below 2.0: 2.0.0 removed `mcp.server.fastmcp`, which the MCP tool
# loader imports — an unbounded `>=1.23` silently pulled 2.0.0 on rebuild and
# left Mira with no tools (503 playbook_unavailable). Bump after a 2.x port.
mcp = ["mcp>=1.23,<2", "langchain-mcp-adapters>=0.1.14,<0.2"]
# OpenTelemetry tracing (observability). Vendor-neutral OTLP spans; a no-op
# when the SDK is absent or no OTLP endpoint is set. Langfuse ingests OTLP, so
# it's reached via the collector — no Langfuse-specific SDK needed here.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mira_contracts = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
