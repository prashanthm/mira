          - generic [ref=e2536]: "Here is the rewritten playbook in plain, simple English. **0DTE SPX Playbook – July 20, 2026** **Regime:** Dealer gamma is negative, which can make price moves bigger. SPX sits at 7457.7, below its VWAP, meaning sellers are in control. VIX is 18.8 (normal). **Key Levels:** - Resistance: 7600 (call wall), 7576, 7549, 7547, 7537 (magnet) - Pivot: 7522 (gamma flip – the line between trends) - Support: 7525 (max pain), 7532 **Setups:** 1. **If SPX stays below 7522:** Trade with the move, not against it. The next downside target is 7300. If it climbs back above 7522, that means selling pressure is easing. 2. **If SPX climbs back above 7522:** Expect a range again. Sell rallies near the 7600 resistance. **What to Watch:** Watch if SPX can hold above or below the 7522 pivot. This line decides whether the trend stays bearish or shifts back to a range. **Caveat:** The dealer-gamma (GEX) read is computed from overnight open interest and is BLIND to 0DTE positioning — roughly half of SPX option volume. Treat it as context, not a guarantee. Context for reading the tape, NOT a signal (ADR-008). Places no orders (ADR-010). Not financial advice."
