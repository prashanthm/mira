          - paragraph [ref=e2126]: The IRS wash-sale rule disallows a loss if you buy a substantially identical security within 30 days before or after the sale — in any of your accounts, including IRAs (Rev. Rul. 2008-5) and a spouse's accounts. Single-account tools miss this; Vantage checks every linked account plus scheduled auto-invests before calling a loss harvestable. Estimated benefit assumes your 24% marginal rate — change it in Settings.
