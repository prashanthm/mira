        - generic [ref=e2493]:
          - generic [ref=e2494]:
            - heading "Covered-call ideas live in your Actions" [level=4] [ref=e2496]
            - paragraph [ref=e2497]: The nightly engine flags HOLD & SELL CALL against real lots, with a suggested strike, credit, and basis reduction. Those appear in the Dashboard Action Queue — cross-checked against your Tax Center for wash risk.
          - generic [ref=e2498]:
            - heading "Approval levels differ per account" [level=4] [ref=e2500]
            - paragraph [ref=e2501]: Roth allows covered calls and CSPs at most brokers; 401(k)s rarely allow options at all. The engine only suggests calls on lots in accounts where they're actually executable.
        - generic [ref=e2503]:
          - button "How are covered-call ideas generated?" [ref=e2504] [cursor=pointer]:
            - generic [ref=e2506]: ▾
          - paragraph [ref=e2507]: The nightly analysis looks for lots of 100+ shares held at a loss or near breakeven, targets a strike above cost basis at the next monthly expiry, estimates the credit, and only recommends the call when it isn't wash-blocked. Results are persisted to the decision journal — educational only, not advice.
